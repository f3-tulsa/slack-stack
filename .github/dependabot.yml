version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "13:00"
      timezone: America/Chicago
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /PAXminer
    schedule:
      interval: weekly
      day: saturday
      time: "13:00"
      timezone: America/Chicago
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Weaselbot image is frozen until cutover (#169). Do not open Docker/pip PRs
  # that cannot ship to the running Lambda.
  # - package-ecosystem: docker
  #   directory: /weaselbot
  - package-ecosystem: pip
    directory: /PAXminer
    schedule:
      interval: weekly
      day: saturday
      time: "13:00"
      timezone: America/Chicago
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /PAXminer/database_management
    schedule:
      interval: weekly
      day: saturday
      time: "13:00"
      timezone: America/Chicago
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Weaselbot image is frozen until cutover (#169).
  # - package-ecosystem: pip
  #   directory: /weaselbot
  - package-ecosystem: pip
    directory: /slackblast/slackblast
    schedule:
      interval: weekly
      day: saturday
      time: "13:00"
      timezone: America/Chicago
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /qsignups/qsignups
    schedule:
      interval: weekly
      day: saturday
      time: "13:00"
      timezone: America/Chicago
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /qsignups/weinkes
    schedule:
      interval: weekly
      day: saturday
      time: "13:00"
      timezone: America/Chicago
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: /migration
    schedule:
      interval: weekly
      day: saturday
      time: "13:00"
      timezone: America/Chicago
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
